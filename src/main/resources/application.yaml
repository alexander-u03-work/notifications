server:
  port: 8180
spring:
  application:
    name: raggies-notifications
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/raggies}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: notification_schema
        dialect: org.hibernate.dialect.PostgreSQLDialect
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
    drop-first: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: notification_schema.BATCH_
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8000}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    virtual-host: ${RABBITMQ_VHOST:vhost}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:admin}
    template:
      retry:
        enabled: true
        max-attempts: 3
    listener:
      direct:
        default-requeue-rejected: false
  mail:
    username: ${SMTP_USERNAME:info@raggies.ru}
    password: ${SMTP_PASSWORD:}
    host: ${SMTP_HOST:smtp.yandex.ru}
    port: ${SMTP_PORT:587}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  mail: {APP_MAIL:info@raggies.ru}
  batch-processing:
    chunk-size: 20
    retry-limit: 3
  rabbitmq:
    concurrent-consumers: 5
    dead-letter-routing-key: .dlq
    exchanges:
      users: ${MODERATION_EXCHANGE:users-exchange}
      products: ${MODERATION_EXCHANGE:products-exchange}
      orders: ${ORDERS_EXCHANGE:orders-exchange}
      shops: ${SHOPS_EXCHANGE:shops-exchange}
      default: ${DEFAULT_EXCHANGE:default-exchange}
      dlx: ${DLX:dlx}
    queues:
      users-moderation:
        queue-name: ${USERS_NOTIFICATION_QUEUE:users-moderation-notification-queue}
        routing-keys:
          - ${USERS_MODERATION_NOTIFICATION_ROUTING_KEY:moderation.*}
          - ${REGISTER_NOTIFICATION_ROUTING_KEY:registration.seller.*}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      users-registration:
        queue-name: ${REGISTER_NOTIFICATION_QUEUE:users-register-queue}
        routing-keys: ${REGISTER_NOTIFICATION_ROUTING_KEY:registration.*.create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      products-moderation:
        queue-name: ${PRODUCTS_NOTIFICATION_QUEUE:products-moderation-notification-queue}
        routing-keys:
          - ${PRODUCTS_NOTIFICATION_ROUTING_KEY:moderation.*}
          - ${PRODUCTS_CREATE_NOTIFICATION_ROUTING_KEY:create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      orders-notification:
        queue-name: ${ORDERS_NOTIFICATION_QUEUE:orders-notification-queue}
        routing-keys: ${ORDERS_NOTIFICATION_ROUTING_KEY:*}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      shops-registration:
        queue-name: ${SHOP_REGISTER_NOTIFICATION_QUEUE:shop-registration-queue}
        routing-keys: ${SHOP_REGISTER_NOTIFICATION_ROUTING_KEY:registration.create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      default-improvement-suggestion:
        queue-name: ${DEFAULT_IMPROVEMENT_SUGGESTION_QUEUE:improvement-suggestion-queue}
        routing-keys: ${DEFAULT_IMPROVEMENT_SUGGESTION_ROUTING_KEY:suggestion.create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish

  security:
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://localhost:80

logging:
  file:
    path: logs
    name: raggies-notifications
  logback:
    rollingpolicy:
      min-index: 1
      max-index: 10
    trigger-policy:
      max-file-size: 50MB

server:
  port: 8180
spring:
  application:
    name: raggies-notification
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/raggies}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification_schema
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
    drop-first: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9090/realms/raggies-realm
  rabbitmq:
    virtual-host: vhost
    port: 5672
    username: admin
    password: admin
    template:
      retry:
        enabled: true
        max-attempts: 3
    listener:
      direct:
        default-requeue-rejected: false
  mail:
    username: ${SMTP_USERNAME:smtp}
    password: ${SMTP_PASSWORD:password}
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          transport:
            protocol: smtp
          ssl: enable

app:
  batch-processing:
    chunk-size: 20
    retry-limit: 3
    queues:
      job-processing: ${JOB_PROCESSING_QUEUE:job-processing}
      dead-letter: ${DLQ:dead-letter-queue}
  notifications:
    exchange: raggies
    concurrent-consumers: 5
    queues:
      distribution: ${NOTIFICATION_QUEUE:distribution-notifications}
      personal: ${NOTIFICATION_QUEUE:personal-notifications}
      subscribe-on-register: ${SUBSCRIBE_ON_REGISTER_QUEUE:subscribe-on-register}

logging:
  logback:
    rollingpolicy:
      min-index: 1
      max-index: 10
    trigger-policy:
      max-file-size: 50MB

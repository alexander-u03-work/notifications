spring:
  datasource:
    hikari:
      connectionTimeout: 2000
      maximum-pool-size: 100
  rabbitmq:
    virtual-host: /
  mail:
    username: ${SMTP_USERNAME:smtp}
    password: ${SMTP_PASSWORD:password}
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    properties:
      mail:
        ssl:
          enable: false

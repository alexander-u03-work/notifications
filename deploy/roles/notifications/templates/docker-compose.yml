version: '3'

services:

  raggies-notifications:
    image: {{ app.notifications.image }}:{{ app.notifications.version }}
    container_name: raggies-notifications
    volumes:
      - ./conf/application.yml:/app/conf/application.yml:ro
      - ./conf/logback.xml:/app/conf/logback.xml:ro
      - ./logs:/app/logs
    ports:
      - "{{ app.notifications.port }}:{{ app.notifications.port }}"
    entrypoint: ["java", "-jar", "-Dspring.config.location=file:/app/conf/application.yml", "-Dlogging.config=/app/conf/logback.xml", "raggies-notifications.jar"]
    restart: on-failure
    networks:
      - raggies-network

networks:
  raggies-network:
    name: raggies-network
    external: true
server:
  port: {{ app.notifications.port }}
spring:
  application:
    name: raggies-notifications
  datasource:
    url: {{ app.db.host }}
    username: {{ app.db.username }}
    password: {{ app.db.password }}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: notification_schema
  liquibase:
    change-log: classpath:/db/changelog/master.yaml
    drop-first: false
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
      table-prefix: notification_schema.BATCH_
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://{{ keycloak.host }}:{{ keycloak.port }}/realms/raggies-realm
  rabbitmq:
    host: {{ app.rabbitmq.host }}
    port: {{ app.rabbitmq.port }}
    username: {{ app.rabbitmq.username }}
    password: {{ app.rabbitmq.password }}
    virtual-host: {{ app.rabbitmq.vhost }}
    template:
      retry:
        enabled: true
        max-attempts: 3
    listener:
      direct:
        default-requeue-rejected: false
  mail:
    username: {{ app.mail.username }}
    password: {{ app.mail.password }}
    host: {{ app.mail.host }}
    port: {{ app.mail.port }}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          transport:
            protocol: smtp
          ssl: enable

app:
  mail: info@raggies.ru
  batch-processing:
    chunk-size: 20
    retry-limit: 3
  rabbitmq:
    concurrent-consumers: 5
    dead-letter-routing-key: .dlq
    exchanges:
      users: ${MODERATION_EXCHANGE:users-exchange}
      products: ${MODERATION_EXCHANGE:products-exchange}
      orders: ${ORDERS_EXCHANGE:orders-exchange}
      shops: ${SHOPS_EXCHANGE:shops-exchange}
      default: ${DEFAULT_EXCHANGE:default-exchange}
      dlx: ${DLX:dlx}
    queues:
      users-moderation:
        queue-name: ${USERS_NOTIFICATION_QUEUE:users-moderation-notification-queue}
        routing-keys:
          - ${USERS_MODERATION_NOTIFICATION_ROUTING_KEY:moderation.*}
          - ${REGISTER_NOTIFICATION_ROUTING_KEY:registration.seller.*}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      users-registration:
        queue-name: ${REGISTER_NOTIFICATION_QUEUE:users-register-queue}
        routing-keys: ${REGISTER_NOTIFICATION_ROUTING_KEY:registration.*.create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      products-moderation:
        queue-name: ${PRODUCTS_NOTIFICATION_QUEUE:products-moderation-notification-queue}
        routing-keys:
          - ${PRODUCTS_NOTIFICATION_ROUTING_KEY:moderation.*}
          - ${PRODUCTS_CREATE_NOTIFICATION_ROUTING_KEY:create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      orders-notification:
        queue-name: ${ORDERS_NOTIFICATION_QUEUE:orders-notification-queue}
        routing-keys: ${ORDERS_NOTIFICATION_ROUTING_KEY:*}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      shops-registration:
        queue-name: ${SHOP_REGISTER_NOTIFICATION_QUEUE:shop-registration-queue}
        routing-keys: ${SHOP_REGISTER_NOTIFICATION_ROUTING_KEY:registration.*.create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish
      default-improvement-suggestion:
        queue-name: ${DEFAULT_IMPROVEMENT_SUGGESTION_QUEUE:improvement-suggestion-queue}
        routing-keys: ${DEFAULT_IMPROVEMENT_SUGGESTION_ROUTING_KEY:suggestion.create}
        ttl: 1000
        max-length: 10_000
        overflow: rejectpublish

  security:
    cors:
      allowed-origins:
        - http://{{ app.host }}:{{ api_gateway.port | default(8080) }}
        - http://{{ app.host }}:{{ app.frontend.main_port | default(8085) }}
        - http://{{ app.host }}:{{ app.frontend.seller_port | default(8086) }}
        - http://{{ app.host }}:{{ app.frontend.aggregator_port | default(8087) }}
        - http://{{ app.host }}:{{ app.frontend.storybook_port | default(8088) }}
        - http://{{ app.host }}:80
        - https://{{ app.host }}:443
        - http://localhost:3000
        - http://raggies.ru
        - https://raggies.ru
        - http://seller.raggies.ru
        - https://seller.raggies.ru
        - http://aggregator.raggies.ru
        - https://aggregator.raggies.ru

logging:
  file:
    path: logs
    name: raggies-notifications
  logback:
    rollingpolicy:
      min-index: 1
      max-index: 10
    trigger-policy:
      max-file-size: 10MB

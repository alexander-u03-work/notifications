name: Notifications

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Render link
        env:
          RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from urllib.parse import urlparse

          page = Path("docs/index.html")
          html = page.read_text(encoding="utf-8")
          start_marker = "<!-- render-link:start -->"
          end_marker = "<!-- render-link:end -->"
          start = html.index(start_marker)
          end = html.index(end_marker, start) + len(end_marker)
          block = html[start:end]
          render_url = os.environ.get("RENDER_PUBLIC_URL", "").strip().rstrip("/")

          if render_url:
              parsed = urlparse(render_url)
              if parsed.scheme != "https" or not parsed.netloc or parsed.path not in ("", "/") or parsed.query or parsed.fragment:
                  raise SystemExit("RENDER_PUBLIC_URL must be the Render service base URL, without a path.")
              block = block.replace(start_marker, "").replace(end_marker, "").replace("__RENDER_PUBLIC_URL__", render_url)
          else:
              block = ""

          page.write_text(html[:start] + block + html[end:], encoding="utf-8")
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

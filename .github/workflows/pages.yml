name: Notifications

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy-pages:
    if: vars.PAGES_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Ensure static site exists
        env:
          RENDER_PUBLIC_URL: ${{ vars.RENDER_PUBLIC_URL }}
        run: |
          if [ ! -f docs/index.html ]; then
            mkdir -p docs
            cat <<EOF > docs/index.html
          <!doctype html>
          <html lang="ru">
          <head><meta charset="utf-8"><title>raggies-notifications</title></head>
          <body style="font-family: sans-serif; max-width: 720px; margin: 40px auto;">
            <h1>raggies-notifications</h1>
            <p>Сервис уведомлений (Spring Boot + PostgreSQL + RabbitMQ + Casdoor).</p>
            <p>Сборка: <code>${{ github.sha }}</code></p>
            ${RENDER_PUBLIC_URL:+<p><a href="${RENDER_PUBLIC_URL}/swagger-ui.html">Открыть Swagger UI</a></p>}
          </body>
          </html>
          EOF
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
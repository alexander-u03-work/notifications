name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/alexander-u03-work/notifications

jobs:
  build:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: ./gradlew build --no-daemon --refresh-dependencies

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Run the built image in a container and prove it started
        run: |
          mkdir -p casdoor
          echo "initAdminPassword=admin123" > casdoor/casdoor.env
          echo "{}" > casdoor/init_data.json

          docker compose --profile app up -d --build

          healthy=false
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8180/actuator/health; then
              echo "Container is up and responding"
              healthy=true
              break
            fi
            sleep 2
          done

          docker compose --profile app logs notification
          docker compose --profile app down -v

          $healthy

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Deploy
        if: github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"

  redeploy:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger a Render redeploy of the current image
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -f -X POST "$RENDER_DEPLOY_HOOK_URL"

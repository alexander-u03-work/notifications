stages:
  - test
  - build_app

variables:
  CONTAINER_REGISTRY_USERNAME: raggies
  NOTIFICATION_BUILD_VERSION: ${CI_JOB_ID}

cache:
  paths:
    - .m2/repository

test:
  stage: test
  image: gradle:jdk17
  script:
    - ./gradlew test
  after_script:
    - echo "Tests finished"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build-docker:
  stage: build_app
  only:
    - main
    - develop
  before_script:
    - docker login raggies.gitlab.yandexcloud.net:5050 -u ${CONTAINER_REGISTRY_USERNAME} -p ${CONTAINER_REGISTRY_TOKEN}
  script:
    - docker build . -t raggies.gitlab.yandexcloud.net:5050/main/raggies-devops/raggies-notifications:${NOTIFICATION_BUILD_VERSION} -f Dockerfile
    - docker push raggies.gitlab.yandexcloud.net:5050/main/raggies-devops/raggies-notifications:${NOTIFICATION_BUILD_VERSION}
  after_script:
    - echo "Build finished"
  dependencies:
    - test